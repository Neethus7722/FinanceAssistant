name: CI/CD Pipeline - NextGen Revenue Insights Assistant

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME_BACKEND: financeassistant-backend
  AZURE_WEBAPP_NAME_FRONTEND: financeassistant-frontend
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '18'

jobs:
  # ================================
  # TESTING & QUALITY CHECKS
  # ================================
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install backend dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Set up test environment variables
      run: |
        echo "DATABASE_URL=postgresql+asyncpg://testuser:testpass@localhost:5432/testdb" >> $GITHUB_ENV
        echo "SECRET_KEY=test-secret-key-for-ci" >> $GITHUB_ENV
        echo "OPENAI_API_KEY=test-key" >> $GITHUB_ENV
        echo "OPENAI_API_BASE=https://test.openai.azure.com/" >> $GITHUB_ENV
    
    - name: Run backend tests
      run: |
        cd backend
        pytest tests/ --cov=. --cov-report=xml --cov-report=html
    
    - name: Run frontend tests
      run: |
        cd frontend
        pytest tests/ --cov=. --cov-report=xml --cov-report=html
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        files: ./backend/coverage.xml,./frontend/coverage.xml
        flags: backend,frontend
        name: codecov-umbrella

  # ================================
  # SECURITY SCANNING
  # ================================
  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install security tools
      run: |
        pip install bandit safety
    
    - name: Run Bandit security scan
      run: |
        bandit -r backend/ -f json -o bandit-report.json || true
        bandit -r frontend/ -f json -o bandit-frontend-report.json || true
    
    - name: Run Safety check
      run: |
        cd backend && safety check --json --output safety-backend.json || true
        cd ../frontend && safety check --json --output safety-frontend.json || true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          bandit-*.json
          safety-*.json

  # ================================
  # BUILD DOCKER IMAGES
  # ================================
  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.AZURE_REGISTRY_SERVER }}
        username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
        password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}
    
    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: |
          ${{ secrets.AZURE_REGISTRY_SERVER }}/financeassistant-backend:${{ github.sha }}
          ${{ secrets.AZURE_REGISTRY_SERVER }}/financeassistant-backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: |
          ${{ secrets.AZURE_REGISTRY_SERVER }}/financeassistant-frontend:${{ github.sha }}
          ${{ secrets.AZURE_REGISTRY_SERVER }}/financeassistant-frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ================================
  # DEPLOY TO STAGING
  # ================================
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Deploy to Azure Container Instances (Staging)
      run: |
        # Deploy backend
        az container create \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --name financeassistant-backend-staging \
          --image ${{ secrets.AZURE_REGISTRY_SERVER }}/financeassistant-backend:${{ github.sha }} \
          --registry-login-server ${{ secrets.AZURE_REGISTRY_SERVER }} \
          --registry-username ${{ secrets.AZURE_REGISTRY_USERNAME }} \
          --registry-password ${{ secrets.AZURE_REGISTRY_PASSWORD }} \
          --dns-name-label financeassistant-backend-staging \
          --ports 8000 \
          --environment-variables \
            DATABASE_URL="${{ secrets.STAGING_DATABASE_URL }}" \
            SECRET_KEY="${{ secrets.STAGING_SECRET_KEY }}" \
            OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            OPENAI_API_BASE="${{ secrets.OPENAI_API_BASE }}"
        
        # Deploy frontend
        az container create \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --name financeassistant-frontend-staging \
          --image ${{ secrets.AZURE_REGISTRY_SERVER }}/financeassistant-frontend:${{ github.sha }} \
          --registry-login-server ${{ secrets.AZURE_REGISTRY_SERVER }} \
          --registry-username ${{ secrets.AZURE_REGISTRY_USERNAME }} \
          --registry-password ${{ secrets.AZURE_REGISTRY_PASSWORD }} \
          --dns-name-label financeassistant-frontend-staging \
          --ports 8501 \
          --environment-variables \
            BACKEND_URL="http://financeassistant-backend-staging.azurecontainer.io:8000"

  # ================================
  # DEPLOY TO PRODUCTION
  # ================================
  deploy-production:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Deploy Backend to Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME_BACKEND }}
        images: ${{ secrets.AZURE_REGISTRY_SERVER }}/financeassistant-backend:${{ github.sha }}
    
    - name: Deploy Frontend to Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME_FRONTEND }}
        images: ${{ secrets.AZURE_REGISTRY_SERVER }}/financeassistant-frontend:${{ github.sha }}
    
    - name: Run database migrations
      run: |
        # Connect to production database and run migrations
        az webapp ssh --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --name ${{ env.AZURE_WEBAPP_NAME_BACKEND }} --command "python -m alembic upgrade head"

  # ================================
  # INFRASTRUCTURE DEPLOYMENT
  # ================================
  deploy-infrastructure:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[deploy-infra]')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Deploy ARM Template
      uses: azure/arm-deploy@v1
      with:
        subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP }}
        template: ./infra/azure-resources.bicep
        parameters: ./infra/parameters.json
